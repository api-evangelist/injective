- name: Injective Chain API
  description: >-
    The Injective Chain LCD/REST + Tendermint RPC surface for querying chain state
    (bank, staking, governance, exchange, oracle, tokenfactory, peggy, permissions)
    and broadcasting transactions. Cosmos SDK based, with an EVM JSON-RPC layer.
