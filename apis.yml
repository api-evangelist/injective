    High-throughput read/stream API over the Injective chain and exchange data,
    exposed via gRPC, gRPC-web, and REST plus a Chain Stream WebSocket. Provides
    accounts, auctions, spot and derivative markets, portfolio, oracle, explorer,
    and leaderboard queries and real-time streams.
