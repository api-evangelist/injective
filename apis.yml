aid: injective
name: Injective
description: >-
  Injective is a Layer 1 blockchain purpose-built for Web3 finance, enabling users,
  institutions, and AI agents to trade, tokenize, and transact on-chain with native
  financial primitives including an on-chain central-limit order book, derivatives
  (perpetuals, expiry and pre-launch futures, options), spot markets, real-world-asset
  tokenization, stablecoins, and near-zero-fee payments with instant finality.
  Developers integrate through the Injective Chain LCD/REST API, a high-throughput
  Indexer API (gRPC, gRPC-web, and REST), a Chain Stream WebSocket for real-time
  market and account events, first-party SDKs in TypeScript, Python, Go, Rust, and
  CosmWasm, the injectived CLI, an official Model Context Protocol (MCP) server, and
  a suite of packaged Agent Skills for AI-driven trading and integration.
