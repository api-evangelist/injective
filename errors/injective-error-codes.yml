  ref: https://docs.injective.network/developers-native/injective/exchange/99_errors
- module: insurance
  codespace: insurance
  ref: https://docs.injective.network/developers-native/injective/insurance/99_errors
- module: ocr
  codespace: ocr
  ref: https://docs.injective.network/developers-native/injective/ocr/99_errors
- module: oracle
  codespace: oracle
  ref: https://docs.injective.network/developers-native/injective/oracle/99_errors
- module: peggy
  codespace: peggy
  ref: https://docs.injective.network/developers-native/injective/peggy/99_errors
- module: permissions
  codespace: permissions
