source: https://docs.injective.network/developers-native/injective (per-module Error Codes references)
format: cosmos-codespace-code
description: >-
  Injective returns errors as Cosmos SDK style {codespace, code, message} pairs
  (surfaced over gRPC status and in the LCD/RPC tx response). Each chain module owns
  a codespace and a registry of numeric error codes. This catalog indexes the
  published per-module error-code references; each page enumerates the module's codes
  with their meanings.
envelope:
  fields: [codespace, code, raw_log]
  transport: gRPC status + tx response (LCD/RPC)
modules:
- module: auction
  codespace: auction
  ref: https://docs.injective.network/developers-native/injective/auction/99_errors
- module: exchange
